training:
  model_key: t5_base
  run_id: null
  artifact_root: data/07_model_output
  model_repo_id: UlyssesLynne/urban-planning-llm-model-zoo-v3
  publish_to_hf: true
  tasks:
    - generation
    - verification
    - paraphrase
  max_source_length: 512
  # Full structured paraphrase targets are longer than answer-only targets.
  max_target_length: 384
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  num_train_epochs: 1
  learning_rate: 0.0002
  warmup_ratio: 0.03
  weight_decay: 0.0
  logging_steps: 10
  eval_steps: 200
  save_steps: 200
  save_total_limit: 2
  # Zero disables early stopping; positive values count consecutive non-improving evaluations.
  early_stopping_patience: 0
  early_stopping_threshold: 0.0
  random_seed: 42
  bf16: true
  fp16: false
  resume_from_checkpoint: null
  max_train_samples: null
  max_validation_samples: null
