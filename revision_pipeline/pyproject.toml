[project]
name = "urban-science-revision"
version = "0.1.0"
description = "Leakage-aware Kedro pipeline for UrbanScience instruction augmentation and publishing."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "accelerate>=1.2",
  "bert-score>=0.3.13",
  "bitsandbytes>=0.45; platform_system != 'Darwin'",
  "datasets>=3.2",
  "huggingface-hub>=0.34",
  "kedro>=1.5,<2",
  "kedro-datasets>=6.0",
  "matplotlib>=3.9",
  "openai>=1.109",
  "pandas>=2.2",
  "peft>=0.14",
  "pyarrow>=18",
  "pydantic>=2.8",
  "python-dotenv>=1.0",
  "scikit-learn>=1.5",
  "sentence-transformers>=3.3",
  "rouge-score>=0.1.2",
  "torch>=2.4",
  "transformers>=4.48",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/urban_science_revision"]

[tool.kedro]
package_name = "urban_science_revision"
project_name = "Urban Science Revision"
kedro_init_version = "1.5.0"
source_dir = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.kedro_telemetry]
project_id = "9111557ae6424600b6fe36bd2833bb9c"
